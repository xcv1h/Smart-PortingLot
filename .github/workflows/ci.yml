# CI for Smart PortingLot. The rows of the README's CI/CD table are done in
# this order: Lint, Unit tests, Build, Smoke test, Persistence test, Release
# test. The last four live in one job ("stack") because they all need the
# same running containers. On main, a final job publishes the images.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yaml
        run: docker compose config --quiet

      # hadolint reads the Dockerfile from stdin, so nothing has to be installed.
      # It exits non-zero on any finding at its default threshold, and that
      # non-zero exit is what fails the step.
      - name: hadolint frontend/Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < frontend/Dockerfile

      - name: hadolint backend/Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < backend/Dockerfile

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # pytest.ini and requirements-dev.txt are here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # same Python as the backend image (python:3.13-alpine)

      # requirements-dev.txt pulls in fakeredis, so no Redis server is needed.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  stack:
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --build builds both images from their Dockerfiles (the "Build" row).
      # --wait returns only once backend and redis report healthy, so the API
      # is answering by the time the next step runs.
      - name: Build images and start the stack
        run: docker compose up -d --build --wait

      # curl -sf: -f turns a non-2xx status into a non-zero exit, which fails
      # the step. grep -q fails the same way when the plate is not in the body.
      - name: Smoke test
        run: |
          curl -sf -X POST localhost:8080/api/cars \
               -H 'Content-Type: application/json' -d '{"plate":"12345678"}'
          curl -sf localhost:8080/api/ports | grep -q 12345678

      # down WITHOUT -v keeps the redis-data volume; the plate must still be
      # there after the containers are recreated.
      - name: Persistence test
        run: |
          docker compose down
          docker compose up -d --wait
          curl -sf localhost:8080/api/ports | grep -q 12345678

      # The other half of the API: release the car, then the plate must be
      # gone. The state is saved in a variable first, so a failing curl fails
      # the step by itself and is not mistaken for "plate not found".
      - name: Release test
        run: |
          curl -sf -X DELETE localhost:8080/api/cars/12345678
          ports=$(curl -sf localhost:8080/api/ports)
          if echo "$ports" | grep -q 12345678; then
            echo "plate is still parked after DELETE"
            exit 1
          fi

      # Runs even when an earlier step failed: show what the containers were
      # doing, then remove them and the volume so nothing is left behind.
      - name: Show logs and clean up
        if: always()
        run: |
          docker compose ps
          docker compose logs
          docker compose down -v

  # Bonus: publish both images to GitHub Container Registry (ghcr.io).
  # Only for pushes to main, and only after every check above passed, so a
  # published image is always one that built, started and kept its data.
  publish:
    needs: [stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets the built-in GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is created by GitHub for this run; no secret to set up.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Two tags per image: the short commit SHA (never moves, so any image
      # can be traced back to its commit) and latest (always the newest main).
      # Image names must be lower case, hence ${GITHUB_REPOSITORY,,}.
      # The source label is what makes GitHub show the package on the
      # repository's page and link it back to the code.
      # try: runs one docker command. If it fails, the last lines it printed
      # are repeated as an error annotation, so the reason (for example a
      # push that ghcr.io denied) shows on the run's summary page without
      # opening the log. pipefail makes the `if` see docker's exit code
      # instead of tee's.
      - name: Build and push
        run: |
          set -o pipefail
          try() {
            if ! "$@" 2>&1 | tee /tmp/docker.log; then
              echo "::error title=docker $2 failed::$(grep -v '^$' /tmp/docker.log | tail -n 3 | tr '\n' ' ')"
              exit 1
            fi
          }
          sha=${GITHUB_SHA::7}
          for service in frontend backend; do
            image=ghcr.io/${GITHUB_REPOSITORY,,}-$service
            try docker build \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -t "$image:$sha" -t "$image:latest" "./$service"
            try docker push --all-tags "$image"
          done
