<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>parking-sw</title>
    <!-- Inline icon (a green prompt on black), so the browser does not ask
         nginx for a /favicon.ico that does not exist. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0d0a'/%3E%3Cpath d='M4 4l5 4-5 4' fill='none' stroke='%234be37a' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The page is one terminal screen. app.js fills the empty elements. -->
    <div>parking-sw#show parking-table</div>
    <div id="table"></div>
    <div id="status"></div>
    <div id="log"></div>
    <div id="prompt">
        <label for="cmd">parking-sw#</label>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script src="app.js"></script>
</body>
</html>
