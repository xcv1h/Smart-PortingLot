<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>parking-sw</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The page is one terminal screen. app.js fills the empty elements. -->
    <div>parking-sw#show parking-table</div>
    <div id="table"></div>
    <div id="status"></div>
    <div id="log"></div>
    <div id="prompt">
        <label for="cmd">parking-sw#</label>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <script src="app.js"></script>
</body>
</html>
