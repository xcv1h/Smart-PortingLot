# This file is copied to /etc/nginx/conf.d/default.conf, which the base image
# includes inside its http { } block. That is why it starts at "server".

server {
    listen 80;

    # Static files: index.html, style.css, app.js.
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # "no-cache" makes the browser ask nginx whether a file changed before
        # reusing its copy. Without it, a rebuilt image can keep showing the
        # old app.js until someone does a hard refresh.
        add_header Cache-Control "no-cache";
    }

    # Everything under /api/ goes to the backend container. The browser only
    # ever talks to this nginx, so page and API share one origin: no CORS.
    location /api/ {
        # 127.0.0.11 is Docker's built-in DNS server. It is the thing that
        # turns the compose service name "backend" into a container IP.
        # valid=10s: forget the answer after 10 seconds, so a recreated
        # backend (which gets a new IP) is found again.
        resolver         127.0.0.11 valid=10s;
        # Give up quickly when the name cannot be resolved, so the dashboard
        # gets its 502 before the next 2-second poll.
        resolver_timeout 2s;

        # Why a variable instead of writing the address in proxy_pass:
        # with a literal address, nginx looks up "backend" once at startup
        # and refuses to start if the lookup fails. With a variable, the
        # lookup happens per request (through the resolver above). So this
        # container starts even when the backend is not running yet, and
        # answers 502 on /api/ until it is.
        set $backend http://backend:8000;

        # The backend's routes have no /api prefix (/ports, /cars), so strip
        # it: /api/ports becomes /ports. "break" means: stop rewriting and
        # carry on in this location with the new path.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $backend;
    }
}
