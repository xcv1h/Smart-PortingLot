services:
  frontend:
    build: ./frontend
    ports: 
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      CAPACITY: ${CAPACITY:-8}
      RATE_PER_HOUR: ${RATE_PER_HOUR:-12.0}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 7s
      timeout: 5s
      retries: 5
      start_period: 5s
    
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 7s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
